# Streamlit settings for the public demo (streamlit_app.py, e.g. on Streamlit Community Cloud).
# `python -m ap_coder dashboard` passes the same settings on its command line, so this file changes nothing
# there. The [theme] below is a copy of ap_coder/assets/theme.toml (a test keeps the two the same); the font
# is served from static/ next to streamlit_app.py.

[server]
enableStaticServing = true
showEmailPrompt = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
primaryColor = "#2563eb"
backgroundColor = "#f7f8fa"
secondaryBackgroundColor = "#ffffff"
textColor = "#0f172a"
linkColor = "#1d4ed8"
borderColor = "#e5e7eb"
showWidgetBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
headingFontWeights = [600, 600, 600, 600, 600, 600]
headingFontSizes = ["1.5rem", "1.25rem", "1.0625rem", "0.875rem", "0.875rem", "0.8125rem"]
metricValueFontSize = "1.375rem"
metricValueFontWeight = 600
dataframeHeaderBackgroundColor = "#fafbfc"
dataframeBorderColor = "#eef0f3"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/InterVariable.woff2"
weight = "100 900"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f3f4f6"
textColor = "#0f172a"
borderColor = "#e5e7eb"
primaryColor = "#2563eb"
linkColor = "#1d4ed8"
font = "Inter, sans-serif"
