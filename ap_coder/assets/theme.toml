# AP Coder dashboard theme (passed to Streamlit by `python -m ap_coder dashboard`).
[theme]
primaryColor = "#1f6fd1"
backgroundColor = "#f4f6f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#111c2e"
linkColor = "#1a5fb4"
borderColor = "#e2e6ed"
showWidgetBorder = true
baseRadius = "10px"
buttonRadius = "8px"
font = "Inter, sans-serif"
headingFont = "Inter, sans-serif"
headingFontWeights = [700, 650, 600, 600, 600, 600]
headingFontSizes = ["1.6rem", "1.25rem", "1.05rem", "0.95rem", "0.9rem", "0.85rem"]
metricValueFontSize = "1.6rem"
metricValueFontWeight = 700
dataframeHeaderBackgroundColor = "#f6f8fb"
dataframeBorderColor = "#e2e6ed"
chartCategoricalColors = ["#2a78d6", "#eb6834", "#1baf7a", "#eda100", "#e87ba4", "#008300", "#4a3aa7", "#e34948"]

[[theme.fontFaces]]
family = "Inter"
url = "app/static/InterVariable.woff2"
weight = "100 900"

[theme.sidebar]
backgroundColor = "#0f1b2e"
secondaryBackgroundColor = "#1a2a44"
textColor = "#c9d4e3"
borderColor = "#22344f"
primaryColor = "#7fb3f5"
linkColor = "#a8cbf7"
font = "Inter, sans-serif"
