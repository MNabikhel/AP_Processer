name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check ap_coder tests scripts
          ruff format --check ap_coder tests scripts
      - name: Tests
        run: python -m pytest -q

  windows-installer:
    # The real double-click experience: install.bat on a clean Windows machine, then a second run.
    name: Installer on Windows
    runs-on: windows-latest
    env:
      AP_NO_PAUSE: "1"
      AP_ALLOW_INTERNET: "1"  # this job installs from PyPI and fetches the OCR models (the offline default would not)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First install (non-interactive)
        shell: cmd
        run: install.bat --yes --no-update --skip-tests --no-start
      - name: Check what the installer set up
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = Join-Path $env:USERPROFILE '.ap_coder\settings.json'
          if (-not (Test-Path $settings)) { throw "missing $settings" }
          $data = (Get-Content $settings | ConvertFrom-Json).data_dir
          Write-Host "data folder: $data"
          foreach ($p in @("$data\.env", "$data\invoices", ".venv\Scripts\python.exe", ".venv\ap_coder_launcher.json")) {
            if (-not (Test-Path $p)) { throw "missing $p" }
          }
          $lnk = Join-Path ([Environment]::GetFolderPath('Desktop')) 'AP Coder.lnk'
          if (-not (Test-Path $lnk)) { throw "missing desktop shortcut $lnk" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($lnk).TargetPath
          Write-Host "shortcut -> $target"
          if (-not $target.EndsWith('APProcessor.bat')) { throw "shortcut points to $target" }
      - name: Second install reuses everything
        shell: pwsh
        run: |
          $out = cmd /c "install.bat --yes --no-update --skip-tests --no-start" 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'reusing \.venv') { throw 'venv was not reused' }
          if ($out -notmatch 'all \d+ in place' -or $out -match 'Collecting|Installing collected') { throw 'packages were reinstalled' }
          $count = (Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'AP Coder*.lnk').Count
          if ($count -ne 1) { throw "expected 1 desktop shortcut, found $count" }
      - name: Self-test inside the installed environment
        shell: cmd
        run: .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider
      - name: The server starts and says who it is
        shell: pwsh
        run: |
          $p = Start-Process -FilePath '.venv\Scripts\python.exe' -ArgumentList '-m','ap_coder','serve','--port','8599','--no-browser' -PassThru -RedirectStandardOutput dash.out -RedirectStandardError dash.err
          $health = $null
          foreach ($i in 1..40) {
            Start-Sleep -Seconds 2
            try {
              $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8599/healthz' -TimeoutSec 5
              if ($health.app -eq 'ap-coder') { break }
            } catch { }
          }
          Get-Content dash.out, dash.err -ErrorAction SilentlyContinue | Select-Object -Last 20
          $page = Invoke-WebRequest -Uri 'http://127.0.0.1:8599/' -UseBasicParsing -TimeoutSec 10
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ap_coder*serve*' } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if (-not $health -or $health.app -ne 'ap-coder') { throw 'the server did not answer /healthz' }
          Write-Host "healthz: version $($health.version), folder $($health.folder)"
          if ($page.StatusCode -ne 200) { throw 'the app page was not served' }
      - name: Fresh start keeps settings
        shell: pwsh
        run: |
          $data = (Get-Content (Join-Path $env:USERPROFILE '.ap_coder\settings.json') | ConvertFrom-Json).data_dir
          New-Item -ItemType File -Path "$data\ap_coder.db" -Force | Out-Null
          cmd /c "install.bat --yes --no-update --skip-tests --no-start --fresh-start" | Out-Null
          if (-not (Test-Path "$data\.env")) { throw '.env was not kept' }
          if (Test-Path "$data\ap_coder.db") { throw 'database was not moved to the backup' }
          if (-not (Get-ChildItem $data -Directory -Filter 'backup-*')) { throw 'no backup folder' }

  windows-pilot-launcher:
    # The pilot's one button: APProcessor.bat on a clean Windows machine (Python already installed, as
    # setup-python leaves it). The first double-click reuses that Python (no second one), makes .venv once,
    # prints the readiness summary with the self-check and serves the dashboard; a double-click while it runs
    # only opens the running one; a later double-click reuses everything and starts within a minute.
    name: Pilot launcher on Windows (APProcessor.bat)
    runs-on: windows-latest
    env:
      AP_NO_PAUSE: "1"
      AP_ALLOW_INTERNET: "1"  # set up online, from PyPI (no wheelhouse here); the offline bundle job runs without it
      BROWSER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: First double-click sets up, checks itself and serves the dashboard; a second one opens it
        shell: pwsh
        run: |
          $userPython = Join-Path $env:LOCALAPPDATA 'Programs\Python'
          $hadUserPython = Test-Path $userPython
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','APProcessor.bat','--port','8597' -PassThru `
            -RedirectStandardOutput launch1.out -RedirectStandardError launch1.err
          $ok = $false
          foreach ($i in 1..180) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8597/' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
          }
          $out = Get-Content launch1.out -Raw -ErrorAction SilentlyContinue
          Write-Host $out
          Get-Content launch1.err -Tail 40 -ErrorAction SilentlyContinue
          try {
            if (-not $ok) { throw 'APProcessor.bat did not bring the dashboard up' }
            # The Python already on the machine was used: no winget, no second Python, .venv made from it.
            if ($out -match 'winget|Installing Python') { throw 'it tried to install Python although one is installed' }
            if (-not $hadUserPython -and (Test-Path $userPython)) { throw "a second Python appeared in $userPython" }
            $venvHome = ((Get-Content '.venv\pyvenv.cfg' | Select-String '^home\s*=').Line -split '=', 2)[1].Trim()
            Write-Host ".venv made from: $venvHome (setup-python: $env:pythonLocation)"
            if (-not (Test-Path (Join-Path $venvHome 'python.exe'))) { throw ".venv home $venvHome has no python.exe" }
            foreach ($m in @('First run', 'AP Coder readiness:', 'Python 3\.12', 'Packages: installed what was missing',
                             'OCR for scanned invoices', 'Data folder', 'LM Studio: not running', 'Self-check OK: \d+ of \d+')) {
              if ($out -notmatch $m) { throw "the first start did not print: $m" }
            }
            # Double-click again while it runs: the running dashboard is opened, nothing new is started.
            $sw = [Diagnostics.Stopwatch]::StartNew()
            $out2 = cmd /c "APProcessor.bat --port 8597" 2>&1 | Out-String
            $code = $LASTEXITCODE
            Write-Host $out2
            Write-Host "second launch while running: exit $code after $([int]$sw.Elapsed.TotalSeconds) s"
            if ($code -ne 0) { throw "second launch exited with $code" }
            if ($out2 -notmatch 'already running') { throw 'the second launch did not find the running dashboard' }
            if ($out2 -match 'Starting AP Coder|Collecting') { throw 'the second launch set up or started a second copy' }
            # (Counted by listening sockets: .venv's python.exe is a redirector, so one server is two processes.)
            $servers = @(Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue | Where-Object { $_.LocalPort -ge 8501 -and $_.LocalPort -le 8610 })
            $servers | Format-Table LocalAddress, LocalPort, OwningProcess | Out-String | Write-Host
            if (@($servers | Select-Object -ExpandProperty LocalPort -Unique).Count -ne 1) { throw "expected 1 dashboard server, found ports: $($servers.LocalPort -join ', ')" }
          } finally {
            Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ap_coder*' -or $_.CommandLine -like '*launch.py*' } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }
      - name: One desktop shortcut, to APProcessor.bat
        shell: pwsh
        run: |
          $links = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'AP Coder*.lnk')
          if ($links.Count -ne 1) { throw "expected 1 desktop shortcut, found $($links.Count)" }
          $target = (New-Object -ComObject WScript.Shell).CreateShortcut($links[0].FullName).TargetPath
          Write-Host "shortcut -> $target"
          if (-not $target.EndsWith('APProcessor.bat')) { throw "shortcut points to $target" }
      - name: OCR models are on disk (scans read offline)
        shell: cmd
        run: .venv\Scripts\python.exe scripts\fetch_models.py --check
      - name: Doctor passes with no Azure and no model
        shell: cmd
        run: .venv\Scripts\python.exe -m ap_coder doctor
      - name: Sample invoices read right with no AI model and no Azure
        shell: cmd
        run: .venv\Scripts\python.exe scripts\pilot_check.py
      - name: Later double-click reuses everything and starts within a minute
        shell: pwsh
        run: |
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','APProcessor.bat','--port','8597' -PassThru `
            -RedirectStandardOutput launch3.out -RedirectStandardError launch3.err
          $ok = $false
          while ($sw.Elapsed.TotalSeconds -lt 60) {
            Start-Sleep -Seconds 1
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8597/' -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
          }
          $seconds = [int]$sw.Elapsed.TotalSeconds
          $out = Get-Content launch3.out -Raw -ErrorAction SilentlyContinue
          Write-Host $out
          Get-Content launch3.err -Tail 20 -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ap_coder*' -or $_.CommandLine -like '*launch.py*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          Write-Host "dashboard served after $seconds s"
          if (-not $ok) { throw 'the later start did not serve the dashboard within a minute' }
          if ($out -match 'First run|Collecting|Installing|Running the self-check|Fetching the OCR models') { throw 'the later start set something up again' }
          foreach ($m in @('reusing \.venv', 'AP Coder readiness:', 'Packages: all \d+ in place', 'Self-check OK at setup')) {
            if ($out -notmatch $m) { throw "the later start did not print: $m" }
          }
          $links = @(Get-ChildItem ([Environment]::GetFolderPath('Desktop')) -Filter 'AP Coder*.lnk')
          if ($links.Count -ne 1) { throw "expected 1 desktop shortcut, found $($links.Count)" }

  windows-offline-bundle:
    # The air-gapped pilot: build the offline bundle, unzip it on Windows and install it with the internet
    # cut off (every proxy points at a closed port), then read the sample invoices.
    name: Offline bundle on Windows (no internet)
    runs-on: windows-latest
    env:
      AP_NO_PAUSE: "1"
      BROWSER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the bundle (online)
        run: python scripts/build_offline_bundle.py --python 3.12
      - name: Unzip it to a fresh folder
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter 'APProcessor-offline-*.zip' | Select-Object -First 1
          if (-not $zip) { throw 'no bundle built' }
          Write-Host "$($zip.Name): $([math]::Round($zip.Length / 1MB)) MB"
          Expand-Archive -Path $zip.FullName -DestinationPath 'C:\pilot'
          if (-not (Test-Path 'C:\pilot\APProcessor\wheelhouse')) { throw 'no wheelhouse in the bundle' }
      - name: Double-click with the internet cut off
        shell: pwsh
        working-directory: C:\pilot\APProcessor
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_INDEX_URL: http://127.0.0.1:9/simple
          NO_PROXY: 127.0.0.1,localhost
        run: |
          $p = Start-Process -FilePath 'cmd.exe' -ArgumentList '/c','APProcessor.bat','--port','8596' -PassThru `
            -RedirectStandardOutput launch.out -RedirectStandardError launch.err
          $ok = $false
          foreach ($i in 1..180) {
            Start-Sleep -Seconds 5
            try {
              $r = Invoke-WebRequest -Uri 'http://127.0.0.1:8596/' -UseBasicParsing -TimeoutSec 5 -NoProxy
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            if ($p.HasExited) { break }
          }
          $out = Get-Content launch.out -Raw -ErrorAction SilentlyContinue
          Write-Host $out
          Get-Content launch.err -Tail 40 -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Where-Object { $_.CommandLine -like '*ap_coder*' } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          if ($out -notmatch 'wheelhouse') { throw 'did not install from the wheelhouse' }
          if (-not $ok) { throw 'the offline install did not bring the dashboard up' }
          if ($out -notmatch 'Self-check OK') { throw 'the readiness summary did not show the self-check OK' }
      - name: OCR models copied from the bundle, samples read right, still offline
        shell: cmd
        working-directory: C:\pilot\APProcessor
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          .venv\Scripts\python.exe scripts\fetch_models.py --check || exit /b 1
          .venv\Scripts\python.exe scripts\pilot_check.py
      - name: Offline guard tests (no connection but this computer), internet still cut off
        # tests/test_offline_guard.py: the server, every page, every sample, approval, export, Settings and Help under a
        # guard that refuses (and records) any connection that is not to 127.0.0.1, with every proxy and package index
        # pointing at the internet. pytest comes from the bundle's wheelhouse (pip --no-index: never PyPI).
        shell: cmd
        working-directory: C:\pilot\APProcessor
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_INDEX_URL: http://127.0.0.1:9/simple
          NO_PROXY: 127.0.0.1,localhost
        run: |
          .venv\Scripts\python.exe -m pip install --no-index --find-links wheelhouse pytest || exit /b 1
          .venv\Scripts\python.exe -m pytest -q -p no:cacheprovider tests\test_offline_guard.py

  macos-offline-bundle:
    # The tester's Mac: Python 3.14 and nothing else, no internet. Build the offline bundle for it (online),
    # unzip it to a fresh folder, hide every other Python, double-click APProcessor.command with the internet
    # cut off (every proxy points at a closed port, as in the Windows job), then read the sample invoices.
    name: Offline bundle on macOS (no internet)
    runs-on: macos-latest
    env:
      AP_NO_PAUSE: "1"
      BROWSER: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Build the bundle (online)
        run: python scripts/build_offline_bundle.py --python 3.14 --platform macosx_14_0_arm64
      - name: Unzip it to a fresh folder
        run: |
          zip=""
          for f in dist/APProcessor-offline-*.zip; do [ -f "$f" ] && zip="$f" && break; done
          if [ -z "$zip" ]; then echo 'no bundle built'; exit 1; fi
          echo "$zip: $(( $(stat -f %z "$zip") / 1048576 )) MB"
          mkdir -p "$RUNNER_TEMP/pilot"
          unzip -q "$zip" -d "$RUNNER_TEMP/pilot"
          cd "$RUNNER_TEMP/pilot/APProcessor"
          if [ ! -d wheelhouse ]; then echo 'no wheelhouse in the bundle'; exit 1; fi
          if [ ! -x APProcessor.command ]; then echo 'APProcessor.command is not executable after unzip'; exit 1; fi
          python -c "import json; print(json.load(open('bundle_manifest.json'))['targets'])"
      - name: Leave Python 3.14 as the only Python (Homebrew's and python.org's others hidden)
        run: |
          version() { "$1" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null; }
          for f in /opt/homebrew/bin/python* /usr/local/bin/python*; do
            case "$f" in *-config) continue ;; esac
            if [ -x "$f" ] && [ "$(version "$f")" != 3.14 ]; then sudo mv "$f" "$f.hidden"; echo "hid $f"; fi
          done
          for d in /Library/Frameworks/Python.framework/Versions/3.*; do
            if [ -d "$d" ] && [ "${d##*/}" != 3.14 ]; then sudo mv "$d" "$d.hidden"; echo "hid $d"; fi
          done
          for v in 3.10 3.11 3.12 3.13; do
            if command -v "python$v"; then echo "python$v is still on PATH"; exit 1; fi
          done
          echo "python3 on PATH: $(command -v python3) ($(version python3))"
      - name: Double-click with the internet cut off
        working-directory: ${{ runner.temp }}/pilot/APProcessor
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_INDEX_URL: http://127.0.0.1:9/simple
          NO_PROXY: 127.0.0.1,localhost
        run: |
          # GitHub's env names are case-insensitive, so the lower-case copies (read by curl and some tools) are set here.
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY" all_proxy="$ALL_PROXY" no_proxy="$NO_PROXY"
          ./APProcessor.command --port 8596 > launch.out 2> launch.err &
          pid=$!
          ok=""
          for _ in $(seq 1 180); do
            sleep 5
            if curl -fsS --noproxy '*' --max-time 5 -o /dev/null http://127.0.0.1:8596/; then ok=1; break; fi
            if ! kill -0 "$pid" 2>/dev/null; then break; fi
          done
          cat launch.out
          tail -n 40 launch.err || true
          pkill -f 'ap_coder|launch\.py' || true
          if ! grep -q 'wheelhouse' launch.out; then echo 'did not install from the wheelhouse'; exit 1; fi
          if [ -z "$ok" ]; then echo 'the offline install did not bring the dashboard up'; exit 1; fi
          if ! grep -q 'Self-check OK' launch.out; then echo 'the readiness summary did not show the self-check OK'; exit 1; fi
          if ! grep -q 'Python 3\.14' launch.out; then echo 'the launcher did not use Python 3.14'; exit 1; fi
          if grep -Eq 'Downloading https?:|Looking in indexes' launch.out launch.err; then echo 'pip went online'; exit 1; fi
          .venv/bin/python --version
      - name: OCR models copied from the bundle, samples read right, still offline
        working-directory: ${{ runner.temp }}/pilot/APProcessor
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: |
          # GitHub's env names are case-insensitive, so the lower-case copies (read by curl and some tools) are set here.
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY" all_proxy="$ALL_PROXY" no_proxy="$NO_PROXY"
          .venv/bin/python scripts/fetch_models.py --check
          .venv/bin/python scripts/pilot_check.py
      - name: Offline guard tests (no connection but this computer), internet still cut off
        # As in the Windows job: tests/test_offline_guard.py, pytest from the bundle's wheelhouse (never PyPI).
        working-directory: ${{ runner.temp }}/pilot/APProcessor
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          ALL_PROXY: http://127.0.0.1:9
          PIP_INDEX_URL: http://127.0.0.1:9/simple
          NO_PROXY: 127.0.0.1,localhost
        run: |
          # GitHub's env names are case-insensitive, so the lower-case copies (read by curl and some tools) are set here.
          export http_proxy="$HTTP_PROXY" https_proxy="$HTTPS_PROXY" all_proxy="$ALL_PROXY" no_proxy="$NO_PROXY"
          .venv/bin/python -m pip install --no-index --find-links wheelhouse pytest
          .venv/bin/python -m pytest -q -p no:cacheprovider tests/test_offline_guard.py

  update-over-older-install:
    # The update a user does, from the oldest versions of main and from the last one before the web app, each really
    # installed the way its README said (scripts/ci/old_versions.py: its commit's files, its packages from PyPI),
    # used with its own code (demo invoices, one approved with a GL account corrected, a vendor taught, an export
    # batch, a setting, .env values) and left running. The new version's offline bundle is unzipped (into a new folder,
    # or over the old one) and double-clicked with the internet cut off (every proxy points at a closed port). It must
    # stop the old dashboard, keep every invoice (its file and its page picture too), approval, lesson, export, setting
    # and .env value, clean up the old folder and its .venv, be the only install on record, and open at once when
    # double-clicked again. On Windows through APProcessor.bat (PowerShell finds the old dashboard by its port and ends
    # it with taskkill), on a Mac and Linux through APProcessor.command. docs/UPGRADING.md lists every old version;
    # tests/test_update_from_old_versions.py runs all of them (AP_UPGRADE_TESTS=1).
    name: Update from ${{ matrix.old.name }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        old:
          - {name: "the first version, unzipped over", sha: 81f691e, how: cli, where: over}
          - {name: "PR 1, its data in private", sha: db95511, how: by-hand, where: new-folder}
          - {name: "PR 8, the last before the web app", sha: e1cf61a, how: launcher, where: new-folder}
    defaults:
      run:
        shell: bash
    env:
      AP_NO_PAUSE: "1"
      BROWSER: none
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the old versions' code comes from the history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The new version's offline bundle (built online)
        run: python scripts/build_offline_bundle.py --python 3.12 --no-models --out "$RUNNER_TEMP/dist"
      # One step from here on: a process started in the background may not outlive its step on Windows.
      - name: The old version installed, used and running; the new one double-clicked offline, then again
        run: |
          T="$RUNNER_TEMP"; if [ "$RUNNER_OS" = Windows ]; then T="$(cygpath -m "$RUNNER_TEMP")"; fi
          ci() { python "$GITHUB_WORKSPACE/scripts/ci/old_versions.py" "$@"; }
          fail() { echo "FAILED: $*"; exit 1; }
          HOW="${{ matrix.old.how }}"; WHERE="${{ matrix.old.where }}"
          A="$T/old/AP Coder old"
          if [ "$WHERE" = over ]; then B="$A"; else B="$T/AP Coder new/APProcessor"; fi
          bundle=(); if [ "$HOW" = launcher ]; then bundle=(--bundle); fi  # its offline bundle, else GitHub's ZIP
          ci extract "${{ matrix.old.sha }}" "$A" "${bundle[@]}"
          AP_ALLOW_INTERNET=1 ci install "$A" --how "$HOW"
          old_port=""
          if [ "$HOW" != cli ]; then
            AP_ALLOW_INTERNET=1 ci start "$A" --how "$HOW" --log "$T/old.log" | tee "$T/start.out"
            old_port="$(sed -n 's/.*answers on port \([0-9]*\).*/\1/p' "$T/start.out")"
          fi
          ci seed "$A" --how "$HOW" --out "$T/before.json"
          zips=("$T"/dist/APProcessor-offline-*.zip)
          ci unzip "${zips[0]}" "$B"
          [ "$WHERE" = over ] || echo "left by an older version" > "$B/ap_coder/stale_module.py"
          # As downloaded: a ZIP from a browser marks every file it unzips to, on a Mac with the quarantine flag
          # (Archive Utility), on Windows with the Mark of the Web (Explorer's Extract All, Zone 3 = the internet).
          if [ "$RUNNER_OS" = macOS ]; then
            find "$B" -type f -exec xattr -w com.apple.quarantine "0081;$(printf %x "$(date +%s)");Safari;" {} +
          elif [ "$RUNNER_OS" = Windows ]; then
            # shellcheck disable=SC2016  # (PowerShell's $_ and backtick escapes, not the shell's)
            B_DIR="$(cygpath -w "$B")" powershell -NoProfile -Command 'Get-ChildItem -LiteralPath $env:B_DIR -Recurse -File | ForEach-Object { Set-Content -LiteralPath $_.FullName -Stream Zone.Identifier -Value "[ZoneTransfer]`r`nZoneId=3" }'
          fi
          # The double-click, offline: APProcessor.bat on Windows, APProcessor.command elsewhere.
          launch() { if [ "$RUNNER_OS" = Windows ]; then cmd //c "APProcessor.bat $*"; else ./APProcessor.command "$@"; fi; }
          offline() {
            HTTP_PROXY=http://127.0.0.1:9 HTTPS_PROXY=http://127.0.0.1:9 ALL_PROXY=http://127.0.0.1:9 \
            http_proxy=http://127.0.0.1:9 https_proxy=http://127.0.0.1:9 all_proxy=http://127.0.0.1:9 \
            NO_PROXY=127.0.0.1,localhost no_proxy=127.0.0.1,localhost PIP_INDEX_URL=http://127.0.0.1:9/simple "$@"
          }
          cd "$B"
          # Windows: PowerShell as a locked-down office laptop runs it (Constrained Language Mode, as AppLocker or WDAC
          # set it): what the launcher asks of PowerShell must still work, or say plainly what it couldn't do.
          if [ "$RUNNER_OS" = Windows ]; then export __PSLockdownPolicy=4; fi
          offline launch --port 8597 > "$T/launch.out" 2>&1 &
          up=""
          for _ in $(seq 1 180); do
            sleep 5
            if curl -fsS --noproxy '*' --max-time 5 -o /dev/null http://127.0.0.1:8597/healthz; then up=1; break; fi
          done
          cat "$T/launch.out"
          [ -n "$up" ] || fail 'the new version did not start'
          args=(--new "$B" --port 8597 --launch-log "$T/launch.out")
          [ -z "$old_port" ] || args+=(--old-port "$old_port")
          if [ -n "$old_port" ] && [ "$RUNNER_OS" != Windows ]; then args+=(--old-pid "$(cat "$T/old.log.pid")"); fi
          if [ "$WHERE" = new-folder ]; then args+=(--old-gone); fi
          ci check "$T/before.json" "${args[@]}" || fail 'the update lost or left something (the lines above say what)'
          out="$T/launch.out"
          if [ "$HOW" != cli ]; then
            grep -q 'Updated AP Coder from 0.1.0' "$out" || fail 'it did not say it updated from 0.1.0'
            grep -q 'stopping it, so this version takes over' "$out" || fail 'the old dashboard was not noticed'
          fi
          if [ "$WHERE" = new-folder ]; then
            grep -q 'Removed 1 file the older version left' "$out" || fail 'the leftover file was not removed'
            [ ! -e "$B/ap_coder/stale_module.py" ] || fail 'the leftover file is still there'
          fi
          # The marks of the download are gone from the launcher's own scripts (it removes them when it starts).
          if [ "$RUNNER_OS" = macOS ]; then
            ! xattr -p com.apple.quarantine "$B/APProcessor.command" 2>/dev/null || fail 'APProcessor.command is still quarantined'
          elif [ "$RUNNER_OS" = Windows ]; then
            # shellcheck disable=SC2016
            motw="$(B_DIR="$(cygpath -w "$B")" powershell -NoProfile -Command '(Get-Item -LiteralPath (Join-Path $env:B_DIR APProcessor.bat) -Stream Zone.Identifier -ErrorAction SilentlyContinue) -ne $null')"
            echo "APProcessor.bat still marked as downloaded: $motw"
            [ "$(echo "$motw" | tr -d '\r')" = False ] || fail 'APProcessor.bat still has the Mark of the Web'
          fi
          # A second double-click opens the running one, at once.
          start=$(date +%s)
          second="$(offline launch --port 8597 2>&1)"
          echo "$second"
          echo "$second" | grep -q 'already running' || fail 'it did not open the running one'
          if echo "$second" | grep -Eq 'stopping it|Updated AP Coder|Installing'; then fail 'it set up or stopped itself again'; fi
          [ $(( $(date +%s) - start )) -lt 60 ] || fail 'the second double-click took a minute or more'
      - name: Stop what is still running
        if: always()
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            # shellcheck disable=SC2016  # (PowerShell's $_, not the shell's)
            # Not itself: this PowerShell's own command line holds the pattern (it ended itself, and failed the step).
            powershell -NoProfile -Command 'Get-CimInstance Win32_Process | Where-Object { $_.ProcessId -ne $PID -and $_.CommandLine -match "ap_coder|launch\.py|streamlit" } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }' || true
          else
            pkill -f 'ap_coder|launch\.py|streamlit' || true
          fi
