[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-coder"
version = "0.3.0"
description = "AP invoice coder: reads and codes invoices on this computer (offline), Canadian sales tax, review dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "openai>=1.68",
    "pandas>=2.1",
    "pillow>=13",
    "certifi>=2026.10.19",  # (through httpx and openai) PYSEC-2026-4320 is fixed from this version
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    # The dashboard (ap_coder/web): a local web app on 127.0.0.1, like CloseDesk.
    "fastapi>=0.115,<1",
    "uvicorn>=0.52,<1",  # its supervisor without a target (web/server.py, the company server's workers)
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]  # httpx: fastapi.testclient
# Azure Document Intelligence (an optional check of the local reading, switched on in the settings) and Azure
# OpenAI's sign-in: never needed to install or start AP Coder. The offline bundle carries these wheels and the
# launcher installs them from its wheelhouse when it can (never failing when it can't); code switched on to use
# Azure says so plainly when they are missing (ap_coder/ops/offline.py, import_azure).
azure = ["azure-ai-documentintelligence>=1.0.0", "azure-identity>=1.17"]
# Local OCR for scanned invoices and images (capture reads text PDFs without it). RapidOCR 3 runs both models on
# every Python: PP-OCRv4, the first read (its models inside the package), and PP-OCRv5, the second (its models
# come in the offline bundle; scripts/fetch_models.py copies them into place; D-163). RapidOCR stays on 3.4.x:
# the capture confidence table is fitted on its reads, capture/layout.py reads PP-OCRv4 through two of its steps
# (as rapidocr-onnxruntime 1.4.4 did), and later 3.x releases change the model list.
# pillow-heif opens an iPhone's HEIC/HEIF photos, which are read by OCR like any photo.
ocr = ["rapidocr>=3.4,<3.5", "onnxruntime>=1.17", "pillow-heif>=0.18"]

[project.scripts]
ap-coder = "ap_coder.ops.cli:main"

[tool.setuptools.packages.find]
include = ["ap_coder*"]

[tool.setuptools.package-data]
ap_coder = ["BUILD", "assets/*", "static/*", "capture/calibration.json", "web/templates/*", "web/templates/partials/*",
            "web/static/*", "web/static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default run leaves out the slow tests (tests/slow_tests.txt, and every browser test) to stay at a few minutes;
# `python -m pytest -m ""` runs everything, as CI does.
addopts = ["-m", "not slow"]
# Keep only a failed test's temporary folder, of the last run alone: a default run otherwise leaves hundreds of MB.
tmp_path_retention_count = 1
tmp_path_retention_policy = "failed"
# A test stuck for 5 minutes prints every thread's stack, so a hang names itself in the CI log.
faulthandler_timeout = 300
markers = [
    "slow: a browser, or over half a second (tests/conftest.py, tests/slow_tests.txt); run with -m \"\"",
    "upgrade: the real update over each older version (AP_UPGRADE_TESTS=1, tests/launcher/test_update_from_old_versions.py)",
]

[tool.ruff]
line-length = 120
target-version = "py311"
# Project Nayuki's QR Code generator (MIT), kept as published so it can be checked against its release (D-146);
# force-exclude: also when scripts/check.py names it.
extend-exclude = ["ap_coder/web/qrcodegen.py"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["ap_coder"]  # also its old flat paths (ap_coder.store...), which have no file of their own (D-67)

[tool.ruff.format]
exclude = ["*.md"]  # code in the docs is laid out for reading (several fields on a line), not formatted
