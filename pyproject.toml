[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-coder"
version = "0.1.0"
description = "AP invoice coder (PoC): Azure Document Intelligence + Azure OpenAI, Canadian sales tax, review dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-identity>=1.17",
    "openpyxl>=3.1",
    "openai>=1.68",
    "pandas>=2.0",
    "pillow>=10",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "streamlit>=1.60",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ap-coder = "ap_coder.cli:main"

[tool.setuptools.packages.find]
include = ["ap_coder*"]

[tool.setuptools.package-data]
ap_coder = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
