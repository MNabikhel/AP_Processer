[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-coder"
version = "0.3.0"
description = "AP invoice coder: reads and codes invoices on this computer (offline), Canadian sales tax, review dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "openai>=1.68",
    "pandas>=2.1",
    "pillow>=10",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    # The dashboard (ap_coder/web): a local web app on 127.0.0.1, like CloseDesk.
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27,<1"]  # httpx: fastapi.testclient
# Azure Document Intelligence (an optional check of the local reading, switched on in the settings) and Azure
# OpenAI's sign-in: never needed to install or start AP Coder. The offline bundle carries these wheels and the
# launcher installs them from its wheelhouse when it can (never failing when it can't); code switched on to use
# Azure says so plainly when they are missing (ap_coder/ops/offline.py, import_azure).
azure = ["azure-ai-documentintelligence>=1.0.0", "azure-identity>=1.17"]
# Local OCR for scanned invoices and images (capture reads text PDFs without it). RapidOCR 3's PP-OCRv5
# models come in the offline bundle (scripts/fetch_models.py copies them into place); rapidocr-onnxruntime
# (models inside the package) is the fallback. RapidOCR stays on 3.4.x: the capture confidence table is
# fitted on its reads, and later 3.x releases change the model list. rapidocr-onnxruntime says Python up to
# 3.12 in its metadata, but it is pure Python and works on 3.13+: there the launcher installs it on its own,
# without that check (scripts/launch.py, ensure_second_ocr), so scans get two engines on every Python.
# pillow-heif opens an iPhone's HEIC/HEIF photos, which are read by OCR like any photo.
ocr = ["rapidocr>=3.4,<3.5", "onnxruntime>=1.17", "rapidocr-onnxruntime>=1.3; python_version < '3.13'",
       "pillow-heif>=0.18"]

[project.scripts]
ap-coder = "ap_coder.ops.cli:main"

[tool.setuptools.packages.find]
include = ["ap_coder*"]

[tool.setuptools.package-data]
ap_coder = ["BUILD", "assets/*", "static/*", "capture/calibration.json", "web/templates/*", "web/templates/partials/*",
            "web/static/*", "web/static/js/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: takes minutes (skipped unless asked for)",
    "upgrade: the real update over each older version (AP_UPGRADE_TESTS=1, tests/test_update_from_old_versions.py)",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]  # code in the docs is laid out for reading (several fields on a line), not formatted
