[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-coder"
version = "0.1.0"
description = "AP invoice coder (PoC): Azure Document Intelligence + Azure OpenAI, Canadian sales tax, review dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-identity>=1.17",
    "openpyxl>=3.1",
    "openai>=1.68",
    "pandas>=2.1",
    "pillow>=10",
    "pydantic>=2.6",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
    "streamlit>=1.62",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Local OCR for scanned invoices and images (capture reads text PDFs without it). RapidOCR 3's PP-OCRv5
# models come in the offline bundle (scripts/fetch_models.py copies them into place); rapidocr-onnxruntime
# (models inside the package) is the fallback. RapidOCR stays on 3.4.x: the capture confidence table is
# fitted on its reads, and later 3.x releases change the model list. rapidocr-onnxruntime is published for
# Python up to 3.12 only: on 3.13 the OCR add-on is RapidOCR 3 alone (one engine).
ocr = ["rapidocr>=3.4,<3.5", "onnxruntime>=1.17", "rapidocr-onnxruntime>=1.3; python_version < '3.13'"]

[project.scripts]
ap-coder = "ap_coder.cli:main"

[tool.setuptools.packages.find]
include = ["ap_coder*"]

[tool.setuptools.package-data]
ap_coder = ["assets/*", "static/*", "webapp/components/invoice_viewer/*", "capture/calibration.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
exclude = ["*.md"]  # code in the docs is laid out for reading (several fields on a line), not formatted
