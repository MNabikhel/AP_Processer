[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ap-coder"
version = "0.1.0"
description = "Enterprise AP Invoice Coder Engine (PoC): Azure AI Document Intelligence + Azure OpenAI Structured Outputs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "azure-ai-documentintelligence>=1.0.0",
    "azure-identity>=1.17",
    "openai>=1.68",
    "pydantic>=2.6",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
vision = ["pymupdf>=1.24", "pillow>=10"]
dev = ["pytest>=8", "ruff>=0.6", "pymupdf>=1.24", "pillow>=10"]

[project.scripts]
ap-coder = "ap_coder.cli:main"

[tool.setuptools.packages.find]
include = ["ap_coder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
